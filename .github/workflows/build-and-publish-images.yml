name: Build and publish deployment runtime images

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
    paths-ignore:
      - "deploy/helm/**"
      - ".github/workflows/helm-render.yml"
      - ".github/workflows/sync-image-digests.yml"
      - "scripts/sync-image-digests.py"
      - "**/*.md"
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run deployment runtime tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deployment runtime tests
        run: python -m unittest discover -s tests -v

  build-and-publish:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - myota-service
          - myota-gateway
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing') }}
          tags: ghcr.io/myota-platform/${{ matrix.image }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'testing' && format('testing-{0}', github.sha) || format('ci-{0}', github.sha) }}
