name: Build and publish deployment runtime images

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/helm/**"
      - ".github/workflows/helm-render.yml"
      - ".github/workflows/sync-image-digests.yml"
      - "scripts/sync-image-digests.py"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - myota-service
          - myota-gateway
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/myota-platform/${{ matrix.image }}:latest
