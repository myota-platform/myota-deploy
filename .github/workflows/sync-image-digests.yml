name: Roll out newly published service images

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-testing-image-digests
  cancel-in-progress: false

jobs:
  detect-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the testing deployment configuration
        uses: actions/checkout@v4
        with:
          ref: testing
          persist-credentials: true

      - name: Install crane
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3

      - name: Record current public testing image digests
        run: python3 scripts/sync-image-digests.py --tag testing

      - name: Save changed digest values
        id: diff
        run: |
          if git diff --quiet -- deploy/helm/myota-test/values-image-digests-testing.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All published testing image tags are unchanged."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          cp deploy/helm/myota-test/values-image-digests-testing.yaml "$RUNNER_TEMP/values-image-digests-testing.yaml"
          git restore -- deploy/helm/myota-test/values-image-digests-testing.yaml

      - name: Create or update the protected testing-branch PR
        if: steps.diff.outputs.changed == 'true'
        id: proposal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          existing_branch="$(gh pr list --repo "$REPOSITORY" --state open --base testing --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/testing-image-digests-"))][0].headRefName // empty')"
          if [[ -n "$existing_branch" ]]; then
            branch="$existing_branch"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            branch="automation/testing-image-digests-${GITHUB_RUN_ID}"
            git fetch origin testing
            git checkout -b "$branch" origin/testing
          fi

          cp "$RUNNER_TEMP/values-image-digests-testing.yaml" deploy/helm/myota-test/values-image-digests-testing.yaml
          if git diff --quiet -- deploy/helm/myota-test/values-image-digests-testing.yaml; then
            echo "No digest changes remain after checking the open automation PR."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/myota-test/values-image-digests-testing.yaml
          git commit \
            -m "chore(deploy): roll out testing service images" \
            -m "Record published GHCR testing digests for Fleet. The testing branch remains protected; this change is proposed as a PR and merged only after the required checks pass."
          git push origin "$branch"

          pr_number="$(gh pr list --repo "$REPOSITORY" --state open --base testing --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base testing \
              --head "$branch" \
              --title "chore(deploy): roll out testing service images" \
              --body "Automated image-digest update for the public GHCR testing tags. Required deployment checks are dispatched for this commit; auto-merge is enabled only after branch-protection checks pass."
            pr_number="$(gh pr list --repo "$REPOSITORY" --state open --base testing --head "$branch" --json number --jq '.[0].number')"
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Run required checks for the bot-created PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.proposal.outputs.branch }}
        run: |
          gh workflow run python-quality.yml --ref "$BRANCH"
          gh workflow run build-and-publish-images.yml --ref "$BRANCH"
          gh workflow run helm-render.yml --ref "$BRANCH"

      - name: Enable protected auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.proposal.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash
