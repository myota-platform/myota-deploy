name: Helm chart validation

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-render.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm-render.yml"

permissions:
  contents: read

jobs:
  render:
    name: Lint and render MyOTA chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint deploy/helm/myota --values deploy/helm/myota/values.yaml

      - name: Lint Spainip Fleet values
        run: helm lint deploy/helm/myota --values deploy/helm/myota/values-spainip.yaml

      - name: Render chart
        run: >-
          helm template myota deploy/helm/myota
          --namespace myota
          --kube-version 1.30.0
          --values deploy/helm/myota/values.yaml
          --set geodataPipeline.importer.enabled=true
          --set geodataPipeline.importer.image=ghcr.io/myota-platform/myota-service:ci

      - name: Render Spainip Fleet release
        run: >-
          helm template myota deploy/helm/myota
          --namespace myota
          --kube-version 1.30.0
          --values deploy/helm/myota/values-spainip.yaml
          > /tmp/myota-spainip-rendered.yaml

      - name: Verify migration gate and Traefik routes
        run: |
          grep -q 'name: myota-migrations-' /tmp/myota-spainip-rendered.yaml
          grep -q 'name: wait-for-schema' /tmp/myota-spainip-rendered.yaml
          grep -q 'kind: IngressRoute' /tmp/myota-spainip-rendered.yaml
          if grep -q 'helm.sh/hook:' /tmp/myota-spainip-rendered.yaml; then
            echo 'Migrations must run as a normal Job, not a Helm hook.' >&2
            exit 1
          fi
