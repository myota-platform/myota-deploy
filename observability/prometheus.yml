global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: myota-gateway
    static_configs:
      - targets: [gateway:8080]
  - job_name: myota-identity
    static_configs:
      - targets: [identity:8001]
  - job_name: myota-programmes
    static_configs:
      - targets: [programmes:8002]
  - job_name: myota-geodata
    static_configs:
      - targets: [geodata:8003]
  - job_name: myota-activity
    static_configs:
      - targets: [activity:8004]
