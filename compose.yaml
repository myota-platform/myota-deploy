services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: myota
      POSTGRES_PASSWORD: myota-dev-only
      POSTGRES_DB: myota_core
    ports: ["5432:5432"]
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./db/migrations/core/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ./db/bootstrap/00-create-geo.sh:/docker-entrypoint-initdb.d/00-create-geo.sh:ro
      - ./db/migrations/geo/001_geodata.sql:/docker-entrypoint-initdb.d/geo.sql:ro
      - ./db/migrations/geo/002_qgis_views.sql:/docker-entrypoint-initdb.d/geo-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myota -d myota_core"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrations:
    image: postgis/postgis:16-3.4
    command: ["/bin/bash", "/migrations/run.sh"]
    environment:
      PGHOST: postgis
      PGPORT: 5432
      PGUSER: myota
      PGPASSWORD: myota-dev-only
      PGDATABASE: myota_core
    volumes:
      - ./db/migrations:/migrations/migrations:ro
      - ./db/bootstrap:/migrations/bootstrap:ro
      - ./db/migrations/run.sh:/migrations/run.sh:ro
    depends_on: {postgis: {condition: service_healthy}}
  identity:
    build: .
    env_file: [.env]
    environment:
      SERVICE: identity
      CORE_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      MYOTA_ENV: development
      MYOTA_AUTH_SIGNING_KEY: myota-local-development-signing-key
      MYOTA_EXPOSE_DEV_TOKENS: "1"
    depends_on: {migrations: {condition: service_completed_successfully}}
    ports: ["8001:8001"]
  identity-maintenance:
    build: .
    command: ["python3", "services/identity_maintenance.py"]
    environment:
      CORE_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      MYOTA_AUTH_SIGNING_KEY: myota-local-development-signing-key
      MYOTA_IDENTITY_MAINTENANCE_SECONDS: "3600"
    depends_on: {migrations: {condition: service_completed_successfully}}
  programmes:
    build: .
    environment:
      SERVICE: programmes
      CORE_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      MYOTA_AUTH_SIGNING_KEY: myota-local-development-signing-key
    depends_on: {migrations: {condition: service_completed_successfully}}
    ports: ["8002:8002"]
  geodata:
    build: .
    environment:
      SERVICE: geodata
      GEO_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_geo
      MYOTA_AUTH_SIGNING_KEY: myota-local-development-signing-key
    depends_on: {migrations: {condition: service_completed_successfully}}
    ports: ["8003:8003"]
  activity:
    build: .
    environment:
      SERVICE: activity
      CORE_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      MYOTA_AUTH_SIGNING_KEY: myota-local-development-signing-key
      MYOTA_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      MYOTA_OBJECT_STORAGE_ACCESS_KEY: myota-minio
      MYOTA_OBJECT_STORAGE_SECRET_KEY: myota-minio-dev-only
      MYOTA_OBJECT_STORAGE_BUCKET: myota-awards
      MYOTA_CERTIFICATE_BUCKET: myota-certificates
      MYOTA_ACTIVITY_DB_POOL_MAX: "12"
      MYOTA_HTTP_MAX_WORKERS: "64"
    depends_on: {migrations: {condition: service_completed_successfully}}
    ports: ["8004:8004"]
  activity-worker:
    build: .
    command: ["python3", "services/activity_worker.py"]
    environment:
      CORE_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      MYOTA_AUTH_SIGNING_KEY: myota-local-development-signing-key
      MYOTA_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      MYOTA_OBJECT_STORAGE_ACCESS_KEY: myota-minio
      MYOTA_OBJECT_STORAGE_SECRET_KEY: myota-minio-dev-only
      MYOTA_ADIF_BUCKET: myota-adif
      MYOTA_CERTIFICATE_BUCKET: myota-certificates
      MYOTA_ACTIVITY_DB_POOL_MAX: "4"
    depends_on: {migrations: {condition: service_completed_successfully}, nats: {condition: service_started}, minio: {condition: service_started}}
  activity-notifications:
    build: .
    command: ["python3", "services/activity_notification_consumer.py"]
    environment:
      CORE_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      NATS_URL: nats://nats:4222
      MYOTA_ACTIVITY_DB_POOL_MAX: "4"
    depends_on: {migrations: {condition: service_completed_successfully}, nats: {condition: service_started}}
  gateway:
    build: .
    command: ["python3", "services/dev_server.py"]
    environment:
      MYOTA_IDENTITY_URL: http://identity:8001
      MYOTA_PROGRAMMES_URL: http://programmes:8002
      MYOTA_GEODATA_URL: http://geodata:8003
      MYOTA_ACTIVITY_URL: http://activity:8004
    depends_on: [identity, programmes, geodata, activity]
    ports: ["8080:8080"]
  admin-web:
    build: ../myota-admin-web
    depends_on: [gateway]
    ports: ["8090:8080"]
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes: ["nats-data:/data"]
    ports: ["4222:4222"]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: myota-minio
      MINIO_ROOT_PASSWORD: myota-minio-dev-only
    volumes: ["minio-data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  outbox-core:
    build: .
    command: ["python3", "services/outbox_worker.py"]
    environment:
      OUTBOX_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_core
      NATS_URL: nats://nats:4222
      OUTBOX_WORKER: core-outbox
    depends_on: {migrations: {condition: service_completed_successfully}, nats: {condition: service_started}}
  outbox-geo:
    build: .
    command: ["python3", "services/outbox_worker.py"]
    environment:
      OUTBOX_DATABASE_URL: postgresql://myota:myota-dev-only@postgis:5432/myota_geo
      NATS_URL: nats://nats:4222
      OUTBOX_WORKER: geo-outbox
    depends_on: {migrations: {condition: service_completed_successfully}, nats: {condition: service_started}}
volumes:
  postgis-data:
  nats-data:
  minio-data:
