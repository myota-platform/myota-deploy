image:
  repository: ghcr.io/myota-platform/myota-service
  tag: latest
  pullPolicy: IfNotPresent
gateway:
  imageRepository: ghcr.io/myota-platform/myota-gateway
  serviceType: ClusterIP
  port: 8080
adminWeb:
  enabled: true
  imageRepository: ghcr.io/myota-platform/myota-admin-web
  serviceType: ClusterIP
  port: 8080
  servicePort: 8090
services:
  identity: {port: 8001}
  programmes: {port: 8002}
  geodata: {port: 8003}
  activity: {port: 8004, replicas: 3, dbPoolMax: 12, httpMaxWorkers: 64}
activityWorkers:
  enabled: true
  replicas: 2
  dbPoolMax: 4
  pollSeconds: 1
activityNotifications:
  enabled: true
  replicas: 1
objectStorage:
  endpoint: http://myota-minio:9000
  awardBucket: myota-awards
  certificateBucket: myota-certificates
  adifBucket: myota-adif
  existingSecret: myota-minio-auth
  accessKeyKey: access-key
  secretKeyKey: secret-key
geodataPipeline:
  enabled: true
  maxImportFeatures: 5000
  maxCoordinates: 50000
  maxBodyBytes: 33554432
  tileCacheTtlSeconds: 60
  importer:
    enabled: false
    schedule: "0 * * * *"
    image: ghcr.io/myota-platform/myota-service:latest
postgres:
  host: postgis
  coreDatabase: myota_core
  geoDatabase: myota_geo
  existingSecret: myota-postgres
auth:
  environment: production
  existingSecret: myota-auth
  maintenanceEnabled: true
nats:
  image: nats:2.10-alpine
  url: nats://myota-nats:4222
outbox:
  enabled: true
  maxAttempts: 12
resources: {}
