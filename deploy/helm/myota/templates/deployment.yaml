{{- range $name, $cfg := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" $name) }}
spec:
  replicas: {{ default 1 $cfg.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: {{ $name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: {{ $name }}}}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SERVICE
              value: {{ $name | quote }}
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $.Values.postgres.existingSecret }}, key: core-database-url}}
            - name: GEO_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $.Values.postgres.existingSecret }}, key: geo-database-url}}
            - name: MYOTA_REQUIRE_DURABILITY
              value: "1"
            - name: MYOTA_ENV
              value: {{ $.Values.auth.environment | quote }}
            - name: MYOTA_AUTH_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.auth.existingSecret }}, key: signing-key}}
            {{- if eq $name "activity" }}
            - name: MYOTA_OBJECT_STORAGE_ENDPOINT
              value: {{ $.Values.objectStorage.endpoint | quote }}
            - name: MYOTA_OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.objectStorage.existingSecret }}, key: {{ $.Values.objectStorage.accessKeyKey }}}}
            - name: MYOTA_OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.objectStorage.existingSecret }}, key: {{ $.Values.objectStorage.secretKeyKey }}}}
            - name: MYOTA_OBJECT_STORAGE_BUCKET
              value: {{ $.Values.objectStorage.awardBucket | quote }}
            - name: MYOTA_CERTIFICATE_BUCKET
              value: {{ $.Values.objectStorage.certificateBucket | quote }}
            - name: MYOTA_ACTIVITY_DB_POOL_MAX
              value: {{ default 10 $cfg.dbPoolMax | quote }}
            - name: MYOTA_HTTP_MAX_WORKERS
              value: {{ default 64 $cfg.httpMaxWorkers | quote }}
            - name: MYOTA_ADIF_BUCKET
              value: {{ $.Values.objectStorage.adifBucket | quote }}
            {{- end }}
            {{- if and (eq $name "geodata") $.Values.geodataPipeline.enabled }}
            - name: MYOTA_OBJECT_STORAGE_ENDPOINT
              value: {{ $.Values.objectStorage.endpoint | quote }}
            - name: MYOTA_OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.objectStorage.existingSecret }}, key: {{ $.Values.objectStorage.accessKeyKey }}}}
            - name: MYOTA_OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $.Values.objectStorage.existingSecret }}, key: {{ $.Values.objectStorage.secretKeyKey }}}}
            - name: NATS_URL
              value: {{ $.Values.nats.url | default "nats://myota-nats:4222" | quote }}
            - name: GEODATA_PIPELINE_ENABLED
              value: "true"
            - name: GEODATA_MAX_IMPORT_FEATURES
              value: {{ $.Values.geodataPipeline.maxImportFeatures | quote }}
            - name: GEODATA_MAX_COORDINATES
              value: {{ $.Values.geodataPipeline.maxCoordinates | quote }}
            - name: MYOTA_MAX_BODY_BYTES
              value: {{ $.Values.geodataPipeline.maxBodyBytes | quote }}
            - name: GEODATA_TILE_CACHE_TTL_SECONDS
              value: {{ $.Values.geodataPipeline.tileCacheTtlSeconds | quote }}
            {{- end }}
            {{- if eq $name "identity" }}
            - name: MYOTA_BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.auth.existingSecret }}
                  key: bootstrap-email
                  optional: true
            - name: MYOTA_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.auth.existingSecret }}
                  key: bootstrap-password
                  optional: true
            {{- end }}
          ports: [{name: http, containerPort: {{ $cfg.port }} }]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: {{- toYaml $.Values.resources | nindent 12 }}
---
{{- end }}
{{- if .Values.activityWorkers.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-activity-worker
spec:
  replicas: {{ .Values.activityWorkers.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: activity-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: activity-worker}}
    spec:
      containers:
        - name: activity-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python3", "services/activity_worker.py"]
          env:
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: core-database-url}}
            - name: MYOTA_REQUIRE_DURABILITY
              value: "1"
            - name: MYOTA_OBJECT_STORAGE_ENDPOINT
              value: {{ .Values.objectStorage.endpoint | quote }}
            - name: MYOTA_OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.objectStorage.existingSecret }}, key: access-key}}
            - name: MYOTA_OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.objectStorage.existingSecret }}, key: secret-key}}
            - name: MYOTA_ADIF_BUCKET
              value: {{ .Values.objectStorage.adifBucket | quote }}
            - name: MYOTA_CERTIFICATE_BUCKET
              value: {{ .Values.objectStorage.certificateBucket | quote }}
            - name: MYOTA_ACTIVITY_DB_POOL_MAX
              value: {{ .Values.activityWorkers.dbPoolMax | quote }}
            - name: MYOTA_ACTIVITY_WORKER_POLL_SECONDS
              value: {{ .Values.activityWorkers.pollSeconds | quote }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
{{- if .Values.activityNotifications.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-activity-notifications
spec:
  replicas: {{ .Values.activityNotifications.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: activity-notifications}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: activity-notifications}}
    spec:
      containers:
        - name: activity-notifications
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python3", "services/activity_notification_consumer.py"]
          env:
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: core-database-url}}
            - name: MYOTA_REQUIRE_DURABILITY
              value: "1"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: MYOTA_ACTIVITY_DB_POOL_MAX
              value: "4"
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-gateway
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: gateway}}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.imageRepository }}:{{ .Values.image.tag }}"
          command: ["python3", "services/dev_server.py"]
          env:
            - name: MYOTA_IDENTITY_URL
              value: http://myota-identity:8001
            - name: MYOTA_PROGRAMMES_URL
              value: http://myota-programmes:8002
            - name: MYOTA_GEODATA_URL
              value: http://myota-geodata:8003
            - name: MYOTA_ACTIVITY_URL
              value: http://myota-activity:8004
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
---
{{- if .Values.outbox.enabled }}
{{- range $db, $worker := dict "core" "core-outbox" "geo" "geo-outbox" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-{{ $worker }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: {{ $worker }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: {{ $worker }}}}
    spec:
      containers:
        - name: outbox
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          command: ["python3", "services/outbox_worker.py"]
          env:
            - name: OUTBOX_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ $.Values.postgres.existingSecret }}, key: {{ $db }}-database-url}}
            - name: MYOTA_REQUIRE_DURABILITY
              value: "1"
            - name: NATS_URL
              value: {{ $.Values.nats.url | quote }}
            - name: OUTBOX_WORKER
              value: {{ $worker | quote }}
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ $.Values.outbox.maxAttempts | quote }}
---
{{- end }}
{{- end }}
