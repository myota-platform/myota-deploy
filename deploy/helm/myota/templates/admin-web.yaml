{{- if .Values.adminWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-admin-web
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}}
    spec:
      containers:
        - name: admin-web
          image: "{{ .Values.adminWeb.imageRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: {{ .Values.adminWeb.port }}}]
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: myota-admin-web
  labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}
spec:
  type: {{ .Values.adminWeb.serviceType }}
  selector: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}
  ports: [{name: http, port: {{ .Values.adminWeb.servicePort }}, targetPort: http}]
{{- end }}
