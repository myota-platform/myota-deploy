{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.fullname" (dict "name" "observability") }}
data:
  otel-collector.yaml: |
{{ .Files.Get "observability/otel-collector.yaml" | indent 4 }}
  tempo.yaml: |
{{ .Files.Get "observability/tempo.yaml" | indent 4 }}
  prometheus.yml: |
{{ .Files.Get "observability/prometheus.yml" | indent 4 }}
  rules.yml: |
{{ .Files.Get "observability/rules.yml" | indent 4 }}
  alertmanager.yml: |
{{ .Files.Get "observability/alertmanager.yml" | indent 4 }}
  dashboards.yml: |
{{ .Files.Get "observability/grafana/provisioning/dashboards/dashboards.yml" | indent 4 }}
  datasources.yml: |
{{ .Files.Get "observability/grafana/provisioning/datasources/datasources.yml" | indent 4 }}
  myota-operations.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-operations.json" | indent 4 }}
  myota-api-performance.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-api-performance.json" | indent 4 }}
  alert-rules.yml: |
{{ .Files.Get "observability/grafana/provisioning/alerting/alert-rules.yml" | indent 4 }}
  contact-points.yml: |
{{ .Files.Get "observability/grafana/provisioning/alerting/contact-points.yml" | indent 4 }}
  policies.yml: |
{{ .Files.Get "observability/grafana/provisioning/alerting/policies.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "otel-collector") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: otel-collector}
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.observability.otelCollector.image }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib/config.yaml, subPath: otel-collector.yaml}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "otel-collector") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: otel-collector}
  ports:
    - {name: otlp-grpc, port: {{ .Values.observability.otelCollector.servicePort }}, targetPort: otlp-grpc}
    - {name: metrics, port: {{ .Values.observability.otelCollector.metricsPort }}, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "tempo") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: tempo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: tempo}
    spec:
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports: [{name: http, containerPort: 3200}, {name: otlp, containerPort: 4317}]
          volumeMounts:
            - {name: config, mountPath: /etc/tempo/tempo.yaml, subPath: tempo.yaml}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "tempo") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: tempo}
  ports:
    - {name: http, port: {{ .Values.observability.tempo.servicePort }}, targetPort: http}
    - {name: otlp, port: 4317, targetPort: otlp}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "prometheus") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: config, mountPath: /etc/prometheus/rules.yml, subPath: rules.yml}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "prometheus") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
  ports: [{name: http, port: {{ .Values.observability.prometheus.servicePort }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "alertmanager") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: alertmanager}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: alertmanager}
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.observability.alertmanager.image }}
          args: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
          ports: [{name: http, containerPort: 9093}]
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: alertmanager}
  ports: [{name: http, port: {{ .Values.observability.alertmanager.servicePort }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "grafana") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          ports: [{name: http, containerPort: 3000}]
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/alerting/alert-rules.yml, subPath: alert-rules.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/alerting/contact-points.yml, subPath: contact-points.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/alerting/policies.yml, subPath: policies.yml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/myota-operations.json, subPath: myota-operations.json}
            - {name: config, mountPath: /var/lib/grafana/dashboards/myota-api-performance.json, subPath: myota-api-performance.json}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "grafana") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
  ports: [{name: http, port: {{ .Values.observability.grafana.servicePort }}, targetPort: http}]
{{- end }}
