{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.fullname" (dict "name" "observability") }}
data:
  prometheus.yml: |
{{ .Files.Get "observability/prometheus.yml" | indent 4 }}
  dashboards.yml: |
{{ .Files.Get "observability/grafana/provisioning/dashboards/dashboards.yml" | indent 4 }}
  myota-operations.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-operations.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "prometheus") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "prometheus") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
  ports: [{name: http, port: {{ .Values.observability.prometheus.servicePort }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "grafana") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          ports: [{name: http, containerPort: 3000}]
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/myota-operations.json, subPath: myota-operations.json}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "grafana") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
  ports: [{name: http, port: {{ .Values.observability.grafana.servicePort }}, targetPort: http}]
{{- end }}
