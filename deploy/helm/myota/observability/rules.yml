groups:
  - name: myota-observability
    rules:
      - alert: MyOTAMetricsCollectorDown
        expr: up{job="myota-otel-collector"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: MyOTA metrics collector is unavailable}
      - alert: MyOTAServiceMetricsUnavailable
        expr: up{job="myota-otel-collector", exported_job="myota-services"} == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: MyOTA service metrics are unavailable}
      - alert: MyOTAActivityQueueBacklog
        expr: myota_activity_jobs_queued_total{job="myota-otel-collector"} > 100
        for: 10m
        labels: {severity: warning}
        annotations: {summary: MyOTA activity queue backlog is high}
      - alert: MyOTAApiErrorRateHigh
        expr: |
          (
            sum by (service_name, http_route, http_request_method) (rate(myota_http_server_requests_total{http_response_status_code=~"5.."}[5m]))
            /
            clamp_min(sum by (service_name, http_route, http_request_method) (rate(myota_http_server_requests_total[5m])), 0.1)
          ) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: MyOTA API 5xx rate is high
          description: '{{ $labels.service_name }} {{ $labels.http_request_method }} {{ $labels.http_route }} has exceeded 5% server errors for five minutes.'
      - alert: MyOTAApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, service_name, http_route, http_request_method) (rate(myota_http_server_duration_milliseconds_bucket[5m]))) > 1000
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: MyOTA API p95 latency is high
          description: '{{ $labels.service_name }} {{ $labels.http_request_method }} {{ $labels.http_route }} p95 latency has exceeded one second for ten minutes.'
      - alert: MyOTAApiLatencyCritical
        expr: histogram_quantile(0.95, sum by (le, service_name, http_route, http_request_method) (rate(myota_http_server_duration_milliseconds_bucket[5m]))) > 5000
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: MyOTA API p95 latency is critical
          description: '{{ $labels.service_name }} {{ $labels.http_request_method }} {{ $labels.http_route }} p95 latency has exceeded five seconds for five minutes.'
